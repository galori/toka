name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ts:
    name: ts (search helper)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The app shells out to `ts`, so its suites run separately and first:
      # a search-helper regression fails here in about a minute instead of
      # after the slow app legs. The app legs re-run these suites via
      # `npm run rust:test` on purpose: fast fail here, macOS coverage there.
      - name: toka-search tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p toka-search
      - name: ts tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ts
      - name: ts fixture CLI tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ts --features fixtures --test cli
  test:
    name: test (${{ matrix.status-os }}, ${{ matrix.rust-target }}, ${{ matrix.bundles }})
    needs: ts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            status-os: macos-14
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-24.04
            status-os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libepoxy-dev libegl1-mesa-dev libglx-dev librsvg2-dev libmpv2 patchelf webkit2gtk-driver xvfb gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good gstreamer1.0-tools
      - run: npm ci
      - name: Unit tests
        run: |
          npm test
          if [ "$RUNNER_OS" = Linux ]; then
            # The GTK widget tests need a display to open a window on.
            xvfb-run --auto-servernum npm run rust:test
          else
            npm run rust:test
          fi
      - name: Integration tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            for element in qtdemux h264parse avdec_h264 avdec_aac; do
              gst-inspect-1.0 --exists "$element"
              echo "GStreamer element available: $element"
            done
            LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX +render -noreset" \
              npm run test:integration
          else
            npm run test:integration
          fi
      - name: Upload mpv E2E log
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mpv-e2e-log-${{ github.run_attempt }}
          path: /tmp/toka-mpv-e2e.log
          if-no-files-found: ignore
      - name: Dump mpv E2E log on failure
        if: failure() && runner.os == 'Linux'
        run: |
          if [ -f /tmp/toka-mpv-e2e.log ]; then
            echo "=== last 400 lines of /tmp/toka-mpv-e2e.log ==="
            tail -400 /tmp/toka-mpv-e2e.log
          else
            echo "No mpv E2E log was written."
          fi
      - name: Package app
        run: |
          metadata=$(node bin/prepare-build.mjs)
          export VITE_APP_VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).buildVersion)' "$metadata")
          export VITE_BUILD_TIME=$(node -e 'console.log(JSON.parse(process.argv[1]).builtAt)' "$metadata")
          export VITE_GIT_SHA=$(node -e 'console.log(JSON.parse(process.argv[1]).gitSha)' "$metadata")
          {
            echo "VITE_APP_VERSION=$VITE_APP_VERSION"
            echo "VITE_BUILD_TIME=$VITE_BUILD_TIME"
            echo "VITE_GIT_SHA=$VITE_GIT_SHA"
          } >> "$GITHUB_ENV"
          # The `binaries/ts` sidecar the bundles ship: built and staged
          # before the bundler reads it. Compile and bundle stay split on
          # purpose — the bundle overlay (which carries the sidecar) is
          # only ever merged into `tauri bundle`, never into a compile,
          # whose build script would mis-copy the sidecar under cargo's
          # nested per-package build layout. See bin/build.mjs.
          node bin/build-ts-sidecar.mjs --target ${{ matrix.rust-target }}
          npm run tauri build -- --target ${{ matrix.rust-target }} --no-bundle
          npm run tauri bundle -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.bundle.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: toka-${{ matrix.rust-target }}
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle/

name: Release

# Every green main commit is a release: when CI finishes on main with success,
# build both platform bundles and publish them under an automation-owned tag
# (v<major>.<minor>.<main commit count>, derived by bin/prepare-release.mjs).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize releases in trigger order so an older commit cannot publish over a
# newer one. Pending runs queue in order (up to 100 deep) instead of canceling.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    name: build and release (${{ matrix.status-os }}, ${{ matrix.rust-target }}, ${{ matrix.bundles }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            status-os: macos-14
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-24.04
            status-os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libepoxy-dev libegl1-mesa-dev libglx-dev librsvg2-dev libmpv2 patchelf
      - name: Derive and stamp release version
        run: node bin/prepare-release.mjs --stamp >> "$GITHUB_ENV"
      - run: npm ci
      - name: Package app
        run: |
          metadata=$(node bin/prepare-build.mjs)
          export VITE_APP_VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).buildVersion)' "$metadata")
          export VITE_BUILD_TIME=$(node -e 'console.log(JSON.parse(process.argv[1]).builtAt)' "$metadata")
          export VITE_GIT_SHA=$(node -e 'console.log(JSON.parse(process.argv[1]).gitSha)' "$metadata")
          # The `binaries/ts` sidecar the bundles ship: built and staged
          # before the bundler reads it. Compile and bundle stay split on
          # purpose — the bundle overlay (which carries the sidecar) is
          # only ever merged into `tauri bundle`, never into a compile.
          # See bin/build.mjs.
          node bin/build-ts-sidecar.mjs --target ${{ matrix.rust-target }}
          npm run tauri build -- --target ${{ matrix.rust-target }} --no-bundle
          npm run tauri bundle -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.bundle.conf.json
      - name: Archive macOS .app
        if: runner.os == 'macOS'
        run: |
          cd "src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos"
          tar -czf "$GITHUB_WORKSPACE/toka-${{ env.RELEASE_TAG }}-macos-aarch64.app.tar.gz" *.app
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: toka-release-${{ matrix.rust-target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
            toka-*.app.tar.gz
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Derive release version
        run: node bin/prepare-release.mjs >> "$GITHUB_ENV"
      - name: Push release tag
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at HEAD; reusing it."
            else
              echo "Tag $TAG already exists on another commit; refusing to move it."
              exit 1
            fi
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Release runs overlap, so an older commit can publish later: keep
          # Latest selected by version chronology instead of publication order.
          make_latest: legacy
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.deb
            dist/**/*.AppImage

[package]
name = "toka"
version = "0.1.1"
description = "Toka media player and organizer"
authors = ["Toka contributors"]
edition = "2021"

[lib]
name = "toka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["toka-search/e2e"]
native-e2e = ["e2e"]
# Automation without fixtures: the owned-index run drives the real app
# through the embedded WebDriver server, so it needs the wdio plugins but
# must not get the e2e fixture provider or stub commands.
webdriver = []

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libloading = "0.7"
libc = "0.2"
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"
toka-search = { version = "0.1.1", path = "../crates/toka-search" }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
